<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone">

    <section class="screen">
      <header class="header">
        <div>
          <h1>Tasks</h1>
          <p>Create your categorised task boards.</p>
        </div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
      </header>

      <form id="add-bar" class="add-bar">
        <input type="text" id="add-input" placeholder="Add a task..." autocomplete="off" />
        <button type="submit" id="add-button">Add</button>
      </form>

      <div id="board-list"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
